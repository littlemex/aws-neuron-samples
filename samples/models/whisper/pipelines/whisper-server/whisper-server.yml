name: whisper-server
description: |
  Deploys whisper_server.py as a systemd service on EC2, using pre-compiled Neuron
  artifacts from /models/whisper-large-v3-neuron. Serves HTTP POST /transcribe and
  WebSocket ${PATH_PREFIX}/ws on port ${PORT} with NEURON_RT_VISIBLE_CORES pinning.

vars:
  SERVE_DIR: /opt/voice-image-edit/whisper-server
  SERVE_USER: ubuntu
  PORT: "8765"
  PATH_PREFIX: /whisper-neuron
  MODEL_ID: openai/whisper-large-v3
  MODEL_DIR: /models/whisper-large-v3-neuron
  WHISPER_LANGUAGE: ja
  NEURON_CORE: "8"
  VENV: /opt/aws_neuronx_venv_pytorch_2_9_nxd_inference

required_vars:
  - SERVER_TARBALL_URL

defaults:
  timeout: 5m
  retries: 0
  cloudwatch_logs: true

max_concurrency: 1

tasks:
  - id: 00-precheck
    timeout: 30s
    script: scripts/00-precheck.sh

  - id: 10-stop-service
    needs: [00-precheck]
    timeout: 30s
    script: scripts/10-stop-service.sh

  - id: 20-deploy-tarball
    needs: [10-stop-service]
    timeout: 5m
    script: scripts/20-deploy-tarball.sh
    fingerprint_inputs:
      - "{{SERVER_TARBALL_URL}}"

  - id: 30-install-deps
    needs: [20-deploy-tarball]
    timeout: 5m
    script: scripts/30-install-deps.sh

  - id: 40-install-systemd-unit
    needs: [30-install-deps]
    timeout: 1m
    script: scripts/40-install-systemd-unit.sh

  - id: 50-enable-start
    needs: [40-install-systemd-unit]
    timeout: 30s
    script: scripts/50-enable-start.sh

  - id: 60-health-check
    needs: [50-enable-start]
    timeout: 10m
    retries: 60
    retry_delay: 5s
    script: scripts/60-health-check.sh
