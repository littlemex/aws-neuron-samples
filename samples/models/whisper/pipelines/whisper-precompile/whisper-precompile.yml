name: whisper-precompile
description: |
  Runs compile_whisper.py once on trn2.48xlarge to produce Neuron artifacts
  (encoder / decoder / proj .pt files) under MODEL_DIR. Idempotent: skips the
  compile when compile_metadata.json and all three .pt files are already present
  and FORCE_RECOMPILE is not true.

vars:
  MODEL_ID: "openai/whisper-large-v3"
  MODEL_DIR: "/models/whisper-large-v3-neuron"
  BATCH_SIZE: "1"
  MAX_DEC_LEN: "448"
  NEURON_CORE: "8"
  VENV: "/opt/aws_neuronx_venv_pytorch_2_9_nxd_inference"
  WORK_DIR: "/opt/voice-image-edit/whisper-compile"
  FORCE_RECOMPILE: "false"

required_vars:
  - COMPILE_SCRIPT_URL

defaults:
  timeout: 5m
  retries: 0
  cloudwatch_logs: true

max_concurrency: 1

tasks:
  - id: 00-precheck
    timeout: 30s
    script: scripts/00-precheck.sh

  - id: 10-skip-if-cached
    needs: [00-precheck]
    timeout: 30s
    script: scripts/10-skip-if-cached.sh

  - id: 20-fetch-script
    needs: [10-skip-if-cached]
    timeout: 5m
    script: scripts/20-fetch-script.sh
    fingerprint_inputs:
      - "{{COMPILE_SCRIPT_URL}}"

  - id: 30-compile
    needs: [20-fetch-script]
    timeout: 1h
    script: scripts/30-compile.sh
    fingerprint_inputs:
      - "{{MODEL_ID}}"
      - "{{COMPILE_SCRIPT_URL}}"

  - id: 40-verify
    needs: [30-compile]
    timeout: 30s
    script: scripts/40-verify.sh
