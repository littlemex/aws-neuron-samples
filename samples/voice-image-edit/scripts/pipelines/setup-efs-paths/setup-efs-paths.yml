name: setup-efs-paths
description: |
  Sets up a symlink layer that persists model caches, compiled artifacts, and
  server sources onto EFS (/mnt/efs). Requires setup-persistence.sh to have
  already mounted /mnt/efs. Idempotent: existing EFS-pointing symlinks are skipped.

vars:
  EFS_ROOT: /mnt/efs/neuron-workspace
  MODELS_DIR_NAME: models
  VIE_DIR_NAME: voice-image-edit

defaults:
  timeout: 5m
  retries: 0
  cloudwatch_logs: true

max_concurrency: 1

tasks:
  - id: 00-precheck
    timeout: 30s
    script: scripts/00-precheck.sh

  - id: 10-mkdir-efs
    needs: [00-precheck]
    timeout: 30s
    script: scripts/10-mkdir-efs.sh

  - id: 20-mkdir-canonical
    needs: [10-mkdir-efs]
    timeout: 30s
    script: scripts/20-mkdir-canonical.sh

  - id: 30-link-models
    needs: [20-mkdir-canonical]
    timeout: 30m
    script: scripts/30-link-models.sh

  - id: 40-link-voice-image-edit
    needs: [30-link-models]
    timeout: 30m
    script: scripts/40-link-voice-image-edit.sh

  - id: 50-link-compiled-models
    needs: [40-link-voice-image-edit]
    timeout: 30m
    script: scripts/50-link-compiled-models.sh

  - id: 60-link-hf-cache
    needs: [50-link-compiled-models]
    timeout: 30m
    script: scripts/60-link-hf-cache.sh

  - id: 70-summary
    needs: [60-link-hf-cache]
    timeout: 30s
    script: scripts/70-summary.sh
